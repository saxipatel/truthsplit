name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local credentials
        run: scripts/generate_env.sh
      - name: Start databases
        run: docker compose up -d --wait db source-db
      - name: Install backend
        run: make backend-venv
      - name: Lint
        run: make lint
      - name: Tests
        run: make test

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: End-to-end (production stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Generate local credentials
        run: scripts/generate_env.sh
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Demo investigations reproduce the manifest
        run: make verify-demo
      - name: Playwright
        run: make e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/test-results
          retention-days: 7
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

  security:
    name: Dependency and code security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Gitleaks (secrets in Git history)
        run: docker run --rm -v "$PWD":/repo --entrypoint sh zricethezav/gitleaks:v8.21.2 -c "git config --global --add safe.directory /repo && gitleaks git /repo --no-banner --redact"
      - name: Bandit (static analysis of the backend)
        run: |
          pip install bandit pip-audit
          bandit -q -r backend/app
      - name: pip-audit (known vulnerabilities in Python dependencies)
        run: pip-audit ./backend
      - name: npm audit (frontend runtime dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (end-to-end test dependencies)
        working-directory: e2e
        run: npm audit --audit-level=high
