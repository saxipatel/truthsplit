server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The API's own upload limit is 25 MB (TRUTHSPLIT_MAX_UPLOAD_MB); leave room for multipart overhead.
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location /assets/ {
        # File names carry a content hash, so they never change.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(api|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        error_page 413 = @too_large;
    }

    # Same {"detail": ...} shape as the API's own errors, so the UI can show the reason.
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"File exceeds the upload limit."}';
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
